- Storage & Protection:
    - Media storage:
        description: "Download and import dependency · expected SMB share verified"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_HEALTH_URL}}/storage"
          refreshInterval: 15000
          mappings:
            - field: mount
              label: "Mount"
              format: text
            - field: free_gib
              label: "Free GiB"
              format: text
            - field: used_percent
              label: "Used %"
              format: text
            - field: libraries
              label: "Playback mounts"
              format: text
    - Storage watchdog:
        description: "Read-only observation of the existing watchdog; no recovery actions"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_HEALTH_URL}}/storage"
          refreshInterval: 15000
          mappings:
            - field: watchdog
              label: "Watchdog"
              format: text
            - field: probe
              label: "Storage probe"
              format: text
            - field: status
              label: "Storage state"
              format: text
            - field: observed_at
              label: "Last checked"
              format: text
    - Backups:
        description: "No green status without evidence of a successful backup"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_HEALTH_URL}}/backups"
          refreshInterval: 15000
          mappings:
            - field: status
              label: "Monitor"
              format: text
            - field: last_success
              label: "Last success"
              format: text

- Infrastructure:
    - Media host:
        description: "Pi resources · sampled on the host, outside container namespaces"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_HEALTH_URL}}/host"
          refreshInterval: 15000
          mappings:
            - field: load
              label: "Load 1m"
              format: text
            - field: memory_percent
              label: "Memory %"
              format: text
            - field: temperature
              label: "Temp \u00b0C"
              format: text
            - field: containers
              label: "Running containers"
              format: text
            - field: uptime_hours
              label: "Uptime hours"
              format: text
    - Windows media host:
        description: "SMB service availability; filesystem health is shown above"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_HEALTH_URL}}/services/windows"
