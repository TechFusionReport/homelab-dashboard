            - field: cpu_percent
              label: "CPU %"
              format: text
            - field: memory_percent
              label: "Memory %"
              format: text
    - Hetzner:
        description: "Shared infrastructure host · reachability only"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_HEALTH_URL}}/services/hetzner"
