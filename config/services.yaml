- Overview:
    - Needs attention:
        description: "Live checks · failures are grouped by the systems they affect"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_HEALTH_URL}}/summary"
          refreshInterval: 15000
          mappings:
            - field: status
              label: "Overall"
              format: text
            - field: details
              label: "Attention"
              format: text
            - field: checked
              label: "Last checked"
              format: text
            - field: coverage
              label: "Coverage"
              format: text

- Media Server:
